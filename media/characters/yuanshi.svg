<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620" role="img" aria-label="远视角色设定卡，合成样例">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#061a19"/><stop offset=".55" stop-color="#0c302e"/><stop offset="1" stop-color="#15504b"/>
</linearGradient>
<radialGradient id="warm" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#ffe7b8" stop-opacity=".95"/><stop offset=".4" stop-color="#d9a441" stop-opacity=".38"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
</radialGradient>
<radialGradient id="cool" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#f3ead7" stop-opacity=".30"/><stop offset="1" stop-color="#f3ead7" stop-opacity="0"/>
</radialGradient>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="grain">
  <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="11" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<pattern id="fiber" width="28" height="28" patternUnits="userSpaceOnUse">
  <path d="M0 28 L28 0" stroke="#f3ead7" stroke-opacity=".05" stroke-width="1"/>
</pattern>
</defs>
<rect width="480" height="620" fill="url(#sky)"/>
<circle cx="240" cy="250" r="190" fill="url(#cool)" opacity=".55"/>
<circle cx="240" cy="250" r="152" fill="none" stroke="#d9a441" stroke-opacity=".28" stroke-dasharray="2 8"/>
<path d="M0 470 Q120 440 240 456 Q360 472 480 448 L480 620 L0 620 Z" fill="#061b19"/>
<g transform="translate(240 470) scale(2.05 2.05)">
<path d="M-35 0 C-41 -28 -30 -55 -25 -80 Q0 -99 25 -80 C30 -55 41 -28 35 0 Z" fill="#07211f"/>
<circle cx="0" cy="-104" r="16.5" fill="#07211f"/>
<path d="M-7 -118 Q-2 -135 13 -130" stroke="#07211f" stroke-width="7" fill="none" stroke-linecap="round"/>
<circle cx="8" cy="-103" r="10.5" fill="none" stroke="#d9a441" stroke-width="2.4"/>
<path d="M18 -110 L43 -132" stroke="#d9a441" stroke-width="1.6" stroke-opacity=".85"/>
<path d="M-25 -52 Q0 -42 25 -52" stroke="#d9a441" stroke-width="2" fill="none" stroke-opacity=".55"/>
</g>
<rect width="480" height="620" fill="url(#fiber)"/>
<rect width="480" height="620" filter="url(#grain)" opacity=".045"/>
<rect x="18" y="18" width="444" height="584" fill="none" stroke="#f3ead7" stroke-opacity=".18"/>
<text x="42" y="52" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="11" fill="#f3ead7" fill-opacity="0.5" text-anchor="start" font-weight="400" letter-spacing="1.4">SYNTHETIC CHARACTER / 合成角色</text>
<text x="42" y="510" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="54" fill="#f3ead7" fill-opacity="1.0" text-anchor="start" font-weight="600" letter-spacing="6">远视</text>
<text x="44" y="538" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" fill="#d9a441" fill-opacity="1.0" text-anchor="start" font-weight="400" letter-spacing="2">守灯人 · 回声邮局</text>
<text x="240" y="600" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" fill="#f3ead7" fill-opacity="0.62" text-anchor="middle" font-weight="400" letter-spacing="0">“别出声，我把月光借过来。”</text>
<rect x="44" y="548" width="116" height="28" rx="14" fill="#f3ead7" opacity=".08"/><text x="102" y="567" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="12" fill="#f3ead7" fill-opacity="0.72" text-anchor="middle" font-weight="400" letter-spacing="0">单圆镜片</text><rect x="172" y="548" width="116" height="28" rx="14" fill="#f3ead7" opacity=".08"/><text x="230" y="567" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="12" fill="#f3ead7" fill-opacity="0.72" text-anchor="middle" font-weight="400" letter-spacing="0">折光纸棱</text><rect x="300" y="548" width="116" height="28" rx="14" fill="#f3ead7" opacity=".08"/><text x="358" y="567" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="12" fill="#f3ead7" fill-opacity="0.72" text-anchor="middle" font-weight="400" letter-spacing="0">深青披风</text>
<text x="438" y="52" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="11" fill="#f3ead7" fill-opacity="0.4" text-anchor="end" font-weight="400" letter-spacing="0">C / 1724</text>
</svg>