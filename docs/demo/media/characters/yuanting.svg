<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620" role="img" aria-label="远听角色设定卡，合成样例">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#061a19"/><stop offset=".55" stop-color="#0c302e"/><stop offset="1" stop-color="#15504b"/>
</linearGradient>
<radialGradient id="warm" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#ffe7b8" stop-opacity=".95"/><stop offset=".4" stop-color="#d9a441" stop-opacity=".38"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
</radialGradient>
<radialGradient id="cool" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#f3ead7" stop-opacity=".30"/><stop offset="1" stop-color="#f3ead7" stop-opacity="0"/>
</radialGradient>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="grain">
  <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="11" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<pattern id="fiber" width="28" height="28" patternUnits="userSpaceOnUse">
  <path d="M0 28 L28 0" stroke="#f3ead7" stroke-opacity=".05" stroke-width="1"/>
</pattern>
</defs>
<rect width="480" height="620" fill="url(#sky)"/>
<circle cx="240" cy="250" r="190" fill="url(#cool)" opacity=".55"/>
<circle cx="240" cy="250" r="152" fill="none" stroke="#b8452f" stroke-opacity=".28" stroke-dasharray="2 8"/>
<path d="M0 470 Q120 440 240 456 Q360 472 480 448 L480 620 L0 620 Z" fill="#061b19"/>
<g transform="translate(240 470) scale(2.05 2.05)">
<path d="M-39 0 C-45 -30 -32 -58 -27 -82 Q0 -101 27 -82 C32 -58 45 -30 39 0 Z" fill="#07211f"/>
<path d="M-24 -78 Q-4 -62 24 -72" stroke="#b8452f" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="0" cy="-105" r="16" fill="#07211f"/>
<circle cx="-11" cy="-120" r="7" fill="#07211f"/><circle cx="11" cy="-121" r="7" fill="#07211f"/>
<path d="M-17 -109 q-13 5 -11 15 q2 10 13 7 q-8 -7 0 -13" fill="none" stroke="#b8452f" stroke-width="2.3"/>
<path d="M18 -104 q7 -2 9 4" stroke="#b8452f" stroke-width="2" fill="none"/>
<path d="M-24 -30 q24 9 48 -2" stroke="#b8452f" stroke-width="2" fill="none" stroke-opacity=".45"/>
</g>
<rect width="480" height="620" fill="url(#fiber)"/>
<rect width="480" height="620" filter="url(#grain)" opacity=".045"/>
<rect x="18" y="18" width="444" height="584" fill="none" stroke="#f3ead7" stroke-opacity=".18"/>
<text x="42" y="52" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="11" fill="#f3ead7" fill-opacity="0.5" text-anchor="start" font-weight="400" letter-spacing="1.4">SYNTHETIC CHARACTER / 合成角色</text>
<text x="42" y="510" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="54" fill="#f3ead7" fill-opacity="1.0" text-anchor="start" font-weight="600" letter-spacing="6">远听</text>
<text x="44" y="538" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" fill="#b8452f" fill-opacity="1.0" text-anchor="start" font-weight="400" letter-spacing="2">听潮人 · 回声邮局</text>
<text x="240" y="600" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" fill="#f3ead7" fill-opacity="0.62" text-anchor="middle" font-weight="400" letter-spacing="0">“等等，我听见灯在抖。”</text>
<rect x="44" y="548" width="116" height="28" rx="14" fill="#f3ead7" opacity=".08"/><text x="102" y="567" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="12" fill="#f3ead7" fill-opacity="0.72" text-anchor="middle" font-weight="400" letter-spacing="0">贝壳耳廓</text><rect x="172" y="548" width="116" height="28" rx="14" fill="#f3ead7" opacity=".08"/><text x="230" y="567" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="12" fill="#f3ead7" fill-opacity="0.72" text-anchor="middle" font-weight="400" letter-spacing="0">同心声波</text><rect x="300" y="548" width="116" height="28" rx="14" fill="#f3ead7" opacity=".08"/><text x="358" y="567" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="12" fill="#f3ead7" fill-opacity="0.72" text-anchor="middle" font-weight="400" letter-spacing="0">朱砂披带</text>
<text x="438" y="52" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="11" fill="#f3ead7" fill-opacity="0.4" text-anchor="end" font-weight="400" letter-spacing="0">C / 1724</text>
</svg>